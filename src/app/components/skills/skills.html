<section class="skills">
  <div class="skills-content">

    <p class="section-label">MY SKILLS</p>

    <h1>Skills & Technologies</h1>

    <div class="skills-grid">
      @for (skill of skills; track skill) {
        <div class="skill-card">
          <span class="skill-dot"></span>
          <span>{{ skill }}</span>
        </div>
      }
    </div>

  </div>
</section>
